# Plain key=value, unquoted. Hex physical addresses without separators.
# Populate from diagnostics and two original port EDIDs; never guess from port labels.
adapter=
udc=
pc_pa=ffff
pi_pa=ffff
tv_la=0
avr_la=5
# Processor identity avoids competing for three playback LAs used by consoles.
# Set true only if diagnostics establish a free playback slot and better compatibility.
playback_identity=false
usb_backend=trace
trace_pipe=/sys/kernel/tracing/instances/pi-cec/trace_pipe
on_debounce_ms=1500
off_debounce_ms=15000
route_query_ms=3000
warmup_ms=12000
verify_ms=4000
wake_attempts=3
# Standby requires fresh positive TV/AVR routing evidence after the off query.
# If the receiver never emits this evidence, standby stays conservative (skips).
standby=false
standby_policy=fresh
power_verified=false
# Verification covers either all host power states or sleep only. Sleep scope
# accepts Pi reboots on hibernate/power-on, with delayed startup reconciliation.
power_scope=continuous
startup_select_pc=false
# Only for installations where the TV always uses the AVR input. Some LG TVs
# answer Request Active Source with 0.0.0.0 even during the PC/AVR session.
# This excludes TV-native apps from source-ownership protection.
tv_always_receiver=false
usb_verified=false
routing_verified=false
verified_kernel=
